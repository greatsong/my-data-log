name: KOBIS 일별 박스오피스 이어 붙이기

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"      # UTC 1:17 = 한국 시간 오전 10:17 (정각을 피한 분)

permissions:
  contents: write

concurrency:
  group: kobis-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
        with:
          ref: main          # 기본 브랜치에 반영된 최신 CSV를 읽어 앞선 실행의 기록을 이어받는다.

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 도구 설치
        run: pip install -r requirements-collect.txt

      - name: 빠진 날짜 받기
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python kobis_collect.py

      - name: 새 기록이 있을 때만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/kobis_daily_log.csv)" ]; then
            echo "새로 추가된 기록이 없어 커밋하지 않습니다."
          else
            git add data/kobis_daily_log.csv
            git commit -m "KOBIS 일별 박스오피스 이어 붙이기"
            # 실행 중에 저장소가 바뀌었을 수 있으므로 최신 상태를 먼저 가져온 뒤 올린다.
            # 같은 파일의 변경이 충돌하면 어느 한쪽을 임의로 덮어쓰지 않고 여기서 멈춘다.
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "저장소의 같은 파일이 함께 바뀌어 합치지 못했습니다. 이번 실행의 기록은 반영하지 않습니다."
              echo "저장소의 CSV를 확인한 뒤 다시 실행해 주세요."
              exit 1
            fi
            git push
          fi
